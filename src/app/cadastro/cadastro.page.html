<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>cadastro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">cadastro</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-item>
    <ion-input 
      type="email" 
      label="Email" 
      labelPlacement="floating" 
      [(ngModel)]="email"
    ></ion-input>
  </ion-item>
  <ion-item>
    <ion-input 
      type="password" 
      label="Senha" 
      labelPlacement="floating" 
      [(ngModel)]="senha"
    ></ion-input>
  </ion-item>

  
  <ion-button 
    color="tertiary" 
    (click)="cadastrar()"
     expand="block">
    Cadastrar
  </ion-button>


</ion-content>
