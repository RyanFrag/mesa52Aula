<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">login</ion-title>
    </ion-toolbar>
  </ion-header>

<ion-item>
  <ion-input 
    type="email" 
    label="Email" 
    labelPlacement="floating" 
    [(ngModel)]="email"
  ></ion-input>
</ion-item>

<ion-item>
  <ion-input 
    type="password" 
    label="Senha" 
    labelPlacement="floating" 
    [(ngModel)]="senha"
  ></ion-input>
</ion-item>

<ion-button (click)="login()" expand="block">
  Entrar
</ion-button>

<ion-button color="secondary" (click)="entrarComGoogle()" expand="block">
  Entrar com Google
</ion-button>

<ion-button color="tertiary" (click)="inParaCadastrar()" expand="block">
  Ir para Cadastrar
</ion-button>

</ion-content>
